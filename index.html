<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ForCard - 戦略カードゲーム</title>
    <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
    <div id="screen-root"></div>
    <div id="app">
        <header>
            <h1>ForCard</h1>
            <div id="game-info">
                <div>ターン: <span id="turn-counter">1</span> / <span id="total-turns">15</span></div>
                <div id="game-state">準備中</div>
            </div>
        </header>

        <div id="game-container">
            <div id="player-b-section" class="player-section">
                <h2>CPU</h2>
                <div class="score">スコア: <span id="score-b">0</span></div>
                <div id="player-b-status" class="player-status"></div>
                <div class="hand" id="hand-b"></div>
            </div>

            <div id="board-container">
                <div id="board-wrapper">
                    <div id="board-column-labels"></div>
                    <div id="board-row-labels"></div>
                    <div id="board"></div>
                </div>
                <div id="board-info">
                    <div id="action-log" class="action-log"></div>
                    <div id="selected-card-info" style="display: none;"></div>
                </div>
            </div>

            <div id="player-a-section" class="player-section">
                <h2>あなた</h2>
                <div class="score">スコア: <span id="score-a">0</span></div>
                <div id="player-a-status" class="player-status"></div>
                <div class="hand" id="hand-a"></div>
            </div>
        </div>

        <div id="controls">
            <button id="resolve-btn" disabled>決定</button>
            <button id="retry-btn" class="hidden">選びなおす</button>
            <button id="reset-btn">リセット</button>
            <button id="toggle-color-points-btn" class="toggle-btn">色ポイント表示</button>
            <button id="main-menu-btn">メインメニュー</button>
        </div>

        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <h2>ゲーム終了</h2>
                <div id="result-content"></div>
                <button id="close-result-btn">閉じる</button>
            </div>
        </div>

        <div id="menu-confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="menu-confirm-title">
            <div class="modal-content menu-confirm-content">
                <h2 id="menu-confirm-title">メインメニューに戻りますか？</h2>
                <div class="menu-confirm-text">対戦中の状態は失われます。</div>
                <div class="menu-confirm-actions">
                    <button id="menu-confirm-cancel" type="button" class="setup-secondary">キャンセル</button>
                    <button id="menu-confirm-ok" type="button" class="setup-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="dist/main.js?v=14"></script>
</body>
</html>
